# Copia este archivo a inventory.ini y ajústalo a tu flota.
# Cada host es un servidor Zimbra. El nombre de inventario se usa como
# server_id por defecto (puedes sobreescribirlo en host_vars/<host>.yml).

[sendguard]
mail1.cliente-a.pe   ansible_host=10.0.0.11
mail1.cliente-b.pe   ansible_host=10.0.0.12
mail2.cliente-b.pe   ansible_host=10.0.0.13

[sendguard:vars]
ansible_user=root
# Si no entras como root directo, usa un usuario con sudo:
# ansible_user=deploy
# ansible_become=true
