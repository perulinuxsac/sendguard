---
# ── SendGuard · flujo principal del rol ──────────────────────────────────────

- name: Preflight y autodetección
  ansible.builtin.import_tasks: preflight.yml

- name: Verificar que los binarios existen en el control node
  ansible.builtin.stat:
    path: "{{ sendguard_dist_dir }}/{{ item }}"
  loop:
    - sendguard-agent
    - sendguard-ctl
  register: sg_bin_local
  delegate_to: localhost
  become: false

- name: Abortar si falta algún binario (ejecuta `make package` en el repo)
  ansible.builtin.fail:
    msg: >-
      Falta {{ item.item }} en {{ sendguard_dist_dir }}.
      Compila primero con `make package` (o build/build-ctl) en la raíz del repo.
  loop: "{{ sg_bin_local.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Crear directorios de SendGuard
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ sendguard_config_dir }}"
    - "{{ sendguard_db_dir }}"
    - /usr/local/lib/sendguard

# SendGuard ya no interviene el SMTP: la contención es solo firewall (ipset/ufw)
# + suspensión de cuenta. En hosts con versiones <1.1.0 hay que quitar de
# Postfix check_policy_service (policyd) y sendguard_access (rate-limit) ANTES
# de retirar policyd: con el hook puesto y policyd caído, Postfix responde 451
# a todo el correo. El script hace ambos pasos en ese orden y es idempotente.
# Corre antes de regenerar agent.yaml porque lee de ahí el puerto del policyd.
- name: Instalar script de retiro de integración SMTP
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../remove_smtp_hooks.sh"
    dest: /usr/local/lib/sendguard/remove_smtp_hooks.sh
    owner: root
    group: root
    mode: "0755"

- name: Retirar hooks SMTP de SendGuard en Postfix y sendguard-policyd
  ansible.builtin.command: /usr/local/lib/sendguard/remove_smtp_hooks.sh
  environment:
    SENDGUARD_CONFIG_DIR: "{{ sendguard_config_dir }}"
  register: sg_smtp_hooks
  changed_when: "'CHANGED' in sg_smtp_hooks.stdout"

- name: Detalle del retiro de hooks SMTP
  ansible.builtin.debug:
    var: sg_smtp_hooks.stdout_lines
  when: sg_smtp_hooks is changed

- name: Copiar binarios a {{ sendguard_bin_dir }}
  ansible.builtin.copy:
    src: "{{ sendguard_dist_dir }}/{{ item }}"
    dest: "{{ sendguard_bin_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - sendguard-agent
    - sendguard-ctl
  notify:
    - Restart sendguard-agent

- name: Instalar/actualizar la DB GeoIP MaxMind
  ansible.builtin.import_tasks: maxmind.yml
  when:
    - sendguard_maxmind_account_id | length > 0
    - sendguard_maxmind_license_key | length > 0

- name: Asegurar geoip_db_path definido cuando no hay MaxMind
  ansible.builtin.set_fact:
    sendguard_geoip_db_path: "{{ sendguard_geoip_db_path | default('') }}"

# La API key protege los endpoints de escritura de la API local (block/unblock/
# unsuspend/whitelist). Sin ella, cualquier proceso local del servidor podría
# desactivar SendGuard tras un compromiso parcial (p.ej. usuario zimbra o webshell).
# Se genera una vez por host y sobrevive redeploys (agent.yaml se regenera;
# api.key conserva la clave).
- name: Generar API key local del agente (si no existe)
  ansible.builtin.shell: umask 077 && openssl rand -hex 32 > {{ sendguard_config_dir }}/api.key
  args:
    creates: "{{ sendguard_config_dir }}/api.key"
  when: sendguard_api_key | length == 0

- name: Leer API key local
  ansible.builtin.slurp:
    src: "{{ sendguard_config_dir }}/api.key"
  register: sendguard_api_key_slurp
  when: sendguard_api_key | length == 0

- name: Fijar API key efectiva
  ansible.builtin.set_fact:
    sendguard_api_key_effective: >-
      {{ sendguard_api_key if sendguard_api_key | length > 0
         else (sendguard_api_key_slurp.content | b64decode | trim) }}

# api.key debe reflejar SIEMPRE la clave efectiva: sendguard-ctl la lee de ahí
# cuando no se pasa -key. Con clave de flota (sendguard_api_key en vault) el
# archivo podría no existir o quedarse con una clave autogenerada vieja.
- name: Persistir API key efectiva para sendguard-ctl
  ansible.builtin.copy:
    content: "{{ sendguard_api_key_effective }}\n"
    dest: "{{ sendguard_config_dir }}/api.key"
    owner: root
    group: root
    mode: "0600"

- name: Generar agent.yaml
  ansible.builtin.template:
    src: agent.yaml.j2
    dest: "{{ sendguard_config_dir }}/agent.yaml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify:
    - Restart sendguard-agent

- name: Instalar unit de systemd
  ansible.builtin.template:
    src: sendguard-agent.service.j2
    dest: /etc/systemd/system/sendguard-agent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart sendguard-agent

- name: Forzar handlers pendientes antes de habilitar servicios
  ansible.builtin.meta: flush_handlers

- name: Habilitar y arrancar sendguard-agent
  ansible.builtin.systemd:
    name: sendguard-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Verificación post-deploy (segura, no intrusiva)
  ansible.builtin.import_tasks: verify.yml

# Self-test intrusivo: solo se ejecuta con `--tags selftest` (tag `never` lo
# excluye de los despliegues normales). Ver tasks/selftest.yml para las advertencias.
- name: Self-test integral (opt-in)
  ansible.builtin.import_tasks: selftest.yml
  tags:
    - selftest
    - never
